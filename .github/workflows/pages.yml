name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'portfolio/**'
      - 'cv/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync CV HTML from Markdown
        run: node .github/scripts/sync-cv-from-md.mjs

      - name: Generate CV PDFs
        run: |
          npm install puppeteer@24
          npx puppeteer browsers install chrome
          node .github/scripts/generate-cv-pdfs.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
