<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=en.html">
  <title>Luca Muroni — CV</title>
  <link rel="stylesheet" href="cv.css">
  <style>
    .cv-picker {
      max-width: 28rem;
      margin: 4rem auto;
      padding: 2rem;
      text-align: center;
      background: #fff;
      border-radius: 0.5rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    }
    .cv-picker h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    .cv-picker p { margin: 0 0 1.5rem; color: #6b6b6b; }
    .cv-picker-links { display: flex; flex-direction: column; gap: 0.75rem; }
    .cv-picker-links a {
      display: block;
      padding: 0.75rem 1rem;
      border: 1px solid #e5e5e5;
      border-radius: 0.375rem;
      text-decoration: none;
      color: #1a1a1a;
      font-weight: 500;
    }
    .cv-picker-links a:hover { border-color: #2563eb; color: #2563eb; }
  </style>
</head>
<body>
  <div class="cv-picker">
    <h1>Luca Muroni — CV</h1>
    <p>Choose a language</p>
    <div class="cv-picker-links">
      <a href="en.html">English</a>
      <a href="it.html">Italiano</a>
      <a href="../index.html">← Back to portfolio</a>
    </div>
  </div>
  <script src="../analytics.config.js"></script>
  <script src="../analytics.js"></script>
</body>
</html>
