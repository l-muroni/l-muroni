<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #ededed;
      display: flex;
      align-items: center;
      padding: 72px 80px;
      overflow: hidden;
    }
    .accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #3b82f6, #2563eb);
    }
    .content { max-width: 900px; }
    .label {
      font-size: 22px;
      color: #3b82f6;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 18px;
      font-family: Consolas, monospace;
    }
    h1 {
      font-size: 72px;
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
    }
    .tagline {
      font-size: 30px;
      color: #a1a1a1;
      font-family: Consolas, monospace;
      margin-bottom: 28px;
    }
    .desc {
      font-size: 26px;
      color: #cfcfcf;
      line-height: 1.45;
      max-width: 820px;
    }
    .monogram {
      position: absolute;
      right: 80px;
      bottom: 72px;
      width: 120px;
      height: 120px;
      border: 2px solid #262626;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 600;
      color: #ededed;
      font-family: Consolas, monospace;
      background: #111111;
    }
  </style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="content">
    <p class="label">Full Stack Software Engineer</p>
    <h1>Luca Muroni</h1>
    <p class="tagline">Architecture · DevOps · AI · IoT</p>
    <p class="desc">Full stack applications, distributed architectures, and Linux-based deployments — from requirements to production.</p>
  </div>
  <div class="monogram">LM</div>
</body>
</html>
