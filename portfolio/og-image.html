<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      position: relative;
      width: 1200px;
      height: 630px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #ededed;
      display: flex;
      align-items: center;
      padding: 72px 96px;
      overflow: hidden;
    }
    .accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #3b82f6, #2563eb);
    }
    .content {
      flex: 1;
      max-width: 760px;
      z-index: 1;
    }
    .label {
      font-size: 20px;
      color: #3b82f6;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 20px;
      font-family: Consolas, "SF Mono", monospace;
    }
    h1 {
      font-size: 68px;
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
    }
    .tagline {
      font-size: 28px;
      color: #a1a1a1;
      font-family: Consolas, "SF Mono", monospace;
      margin-bottom: 24px;
    }
    .desc {
      font-size: 24px;
      color: #bdbdbd;
      line-height: 1.5;
      max-width: 700px;
    }
    .monogram {
      position: absolute;
      right: 96px;
      top: 50%;
      transform: translateY(-50%);
      width: 180px;
      height: 180px;
      border: 2px solid #262626;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      font-weight: 600;
      color: #ededed;
      font-family: Consolas, "SF Mono", monospace;
      background: linear-gradient(145deg, #141414, #0a0a0a);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }
    .monogram::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="content">
    <p class="label">Full Stack Software Engineer</p>
    <h1>Luca Muroni</h1>
    <p class="tagline">Architecture · DevOps · AI · IoT</p>
    <p class="desc">Full stack applications, distributed architectures, and Linux-based deployments — from requirements to production.</p>
  </div>
  <div class="monogram" aria-hidden="true">LM</div>
</body>
</html>
